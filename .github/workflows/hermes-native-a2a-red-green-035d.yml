name: Hermes Native A2A - immutable source RED/GREEN
on:
  push:
    branches:
      - feature/native-a2a-durable-20261107
    paths:
      - .github/workflows/hermes-native-a2a-red-green-035d.yml
      - plugins/platforms/a2a/**
      - tests/scripts/verify_native_a2a_*.py

permissions:
  contents: read

jobs:
  unsafe-red-and-current-green:
    name: Exact original SIGKILL RED/GREEN (no backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      NOUS_API_KEY: ""
      HERMES_HOME: ${{ runner.temp }}/hermes-a2a-offline
      HEAD_SHA: c79fac10fb6a6b2d7b775de7c963740e30359553
      UNSAFE_SHA: 1244903edc3cd67ed03b131b2965d25c788ae0fa
    steps:
      - name: Read exact original executable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: c79fac10fb6a6b2d7b775de7c963740e30359553
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable pin and current test blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD:tests/scripts/verify_native_a2a_cancel_restart.py)" = "934da05bfee00b9d8912a7db98f1d1bac05aeacc"
          python3 --version
      - name: Deterministic RED on prior unsafe ORIGINAL executable source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$UNSAFE_SHA"
          red_tree="$(mktemp -d)"
          trap 'rm -rf -- "$red_tree"' EXIT
          mkdir -p "$red_tree"
          git archive "$UNSAFE_SHA" | tar -x -C "$red_tree"
          test "$(git rev-parse "$UNSAFE_SHA")" = "$UNSAFE_SHA"
          # Copy ONLY the exact-current regression test; all executable files remain old ORIGINAL.
          cp tests/scripts/verify_native_a2a_cancel_restart.py "$red_tree/tests/scripts/"
          cd "$red_tree"
          set +e
          python3 -u tests/scripts/verify_native_a2a_cancel_restart.py \
            UnverifiedCallbackCancelSafety.test_local_cancelled_without_stop_authority_survives_sigkill_and_late_callback \
            UnverifiedCallbackCancelSafety.test_direct_outcome_sink_rejects_unverified_canceled_without_side_effects \
            > "$RUNNER_TEMP/hermes-red.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/hermes-red.log"
          test "$rc" -ne 0
          grep -q '^FAIL: test_local_cancelled_without_stop_authority_survives_sigkill_and_late_callback ' "$RUNNER_TEMP/hermes-red.log"
          grep -q '^FAIL: test_direct_outcome_sink_rejects_unverified_canceled_without_side_effects ' "$RUNNER_TEMP/hermes-red.log"
          ! grep -q '^ERROR: ' "$RUNNER_TEMP/hermes-red.log"
          echo "CONFIRMED RED: unsafe ORIGINAL $UNSAFE_SHA, real SIGKILL and direct sink."
      - name: Current ORIGINAL GREEN - local cancel and ordinary outcome controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 -u tests/scripts/verify_native_a2a_cancel_restart.py \
            UnverifiedCallbackCancelSafety.test_local_cancelled_without_stop_authority_survives_sigkill_and_late_callback \
            UnverifiedCallbackCancelSafety.test_direct_outcome_sink_rejects_unverified_canceled_without_side_effects \
            UnverifiedCallbackCancelSafety.test_normal_success_and_failure_outcomes_remain_terminal
          echo "CANCEL-ONLY GREEN: ORIGINAL $HEAD_SHA; forged scope separately gated."

      - name: Exact ORIGINAL forged cross-scope SUCCESS/FAILURE SIGKILL gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          set +e
          python3 -u tests/scripts/verify_native_a2a_cancel_restart.py \
            UnverifiedCallbackCancelSafety.test_forged_stale_success_failure_cannot_settle_foreign_task_after_sigkill \
            > "$RUNNER_TEMP/hermes-forged.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/hermes-forged.log"
          if [ "$rc" -eq 0 ]; then
            echo "FORGED SCOPE GREEN: ORIGINAL $HEAD_SHA, both outcomes and real SIGKILL."
          elif grep -q '^FAIL: test_forged_stale_success_failure_cannot_settle_foreign_task_after_sigkill ' "$RUNNER_TEMP/hermes-forged.log" \
               && ! grep -q '^ERROR: ' "$RUNNER_TEMP/hermes-forged.log"; then
            echo "::error::FORGED SCOPE RED on exact ORIGINAL $HEAD_SHA; source needs fail-closed repair."
            exit 1
          else
            echo "::error::INCONCLUSIVE forged callback probe (import, test, or subprocess failure)."
            exit 2
          fi

      - name: All 19 exact-original A2A security suites (no skips)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          suites=(
            tests/scripts/verify_native_a2a_peer_scope_stdlib.py
            tests/scripts/verify_native_a2a_durable_stdlib.py
            tests/scripts/verify_native_a2a_admission_race.py
            tests/scripts/verify_native_a2a_context_isolation.py
            tests/scripts/verify_native_a2a_immutable_scope.py
            tests/scripts/verify_native_a2a_cross_worker.py
            tests/scripts/verify_native_a2a_http_framing.py
            tests/scripts/verify_native_a2a_late_reply_binding.py
            tests/scripts/verify_native_a2a_forward_receipt_binding.py
            tests/scripts/verify_native_a2a_forward_terminal_gate.py
            tests/scripts/verify_native_a2a_cancel_restart.py
            tests/scripts/verify_native_a2a_push_egress.py
            tests/scripts/verify_native_a2a_stop_receipt_scope.py
            tests/scripts/verify_native_a2a_stop_ack_gap.py
            tests/scripts/verify_native_a2a_stop_attempt_clock.py
            tests/scripts/verify_native_a2a_stop_lease_write_once.py
            tests/plugins/test_a2a_sigkill_replay_terminal.py
            tests/plugins/test_a2a_sigkill_restart_http.py
            tests/scripts/verify_native_a2a_terminal_metadata_fence.py
          )
          passed=0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            log="$(mktemp)"
            if ! timeout 240 python3 -u "$suite" >"$log" 2>&1; then
              cat "$log"; rm -f "$log"; echo "::error::failed suite $suite"; exit 1
            fi
            cat "$log"
            if ! grep -Eq '^Ran [1-9][0-9]* tests? in ' "$log" || grep -Eq '^OK \(skipped=|^FAILED|^Ran 0 tests' "$log"; then
              echo "::error::zero tests or skipped suite: $suite"; rm -f "$log"; exit 1
            fi
            n="$(sed -nE 's/^Ran ([0-9]+) tests? in .*/\1/p' "$log" | tail -n 1)"
            passed=$(( passed + n ))
            rm -f "$log"
            echo "::endgroup::"
          done
          echo "ALL_19_GREEN EXACT_SOURCE=$HEAD_SHA suites=${#suites[@]} tests=$passed"
