name: Hermes Native A2A - immutable source RED/GREEN
on:
  push:
    branches:
      - feature/native-a2a-durable-20261107
    paths:
      - .github/workflows/hermes-native-a2a-red-green-035d.yml
      - plugins/platforms/a2a/**
      - tests/scripts/verify_native_a2a_*.py

permissions:
  contents: read

jobs:
  unsafe-red-and-current-green:
    name: Exact original SIGKILL RED/GREEN (no backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      NOUS_API_KEY: ""
      HERMES_HOME: ${{ runner.temp }}/hermes-a2a-offline
      HEAD_SHA: 035d36b76715e69ddcc9066312be309c04676dca
      UNSAFE_SHA: 1244903edc3cd67ed03b131b2965d25c788ae0fa
    steps:
      - name: Read exact original executable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 035d36b76715e69ddcc9066312be309c04676dca
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable pin and current test blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD:tests/scripts/verify_native_a2a_cancel_restart.py)" = "cdbc85b75ebb280c81aeb27d8a5e82a41bd28352"
          python3 --version
      - name: Deterministic RED on prior unsafe ORIGINAL executable source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$UNSAFE_SHA"
          red_tree="$(mktemp -d)"
          trap 'rm -rf -- "$red_tree"' EXIT
          mkdir -p "$red_tree"
          git archive "$UNSAFE_SHA" | tar -x -C "$red_tree"
          test "$(git rev-parse "$UNSAFE_SHA")" = "$UNSAFE_SHA"
          # Copy ONLY the exact-current regression test; all executable files remain old ORIGINAL.
          cp tests/scripts/verify_native_a2a_cancel_restart.py "$red_tree/tests/scripts/"
          cd "$red_tree"
          set +e
          python3 -u tests/scripts/verify_native_a2a_cancel_restart.py \
            UnverifiedCallbackCancelSafety.test_local_cancelled_without_stop_authority_survives_sigkill_and_late_callback \
            UnverifiedCallbackCancelSafety.test_direct_outcome_sink_rejects_unverified_canceled_without_side_effects \
            > "$RUNNER_TEMP/hermes-red.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/hermes-red.log"
          test "$rc" -ne 0
          grep -q '^FAIL: test_local_cancelled_without_stop_authority_survives_sigkill_and_late_callback ' "$RUNNER_TEMP/hermes-red.log"
          grep -q '^FAIL: test_direct_outcome_sink_rejects_unverified_canceled_without_side_effects ' "$RUNNER_TEMP/hermes-red.log"
          ! grep -q '^ERROR: ' "$RUNNER_TEMP/hermes-red.log"
          echo "CONFIRMED RED: unsafe ORIGINAL $UNSAFE_SHA, real SIGKILL and direct sink."
      - name: Current ORIGINAL GREEN - full cancellation/restart script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 -u tests/scripts/verify_native_a2a_cancel_restart.py
          echo "CONFIRMED GREEN: ORIGINAL $HEAD_SHA."

  original-security-suites:
    name: All ORIGINAL native A2A security scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      NOUS_API_KEY: ""
      HEAD_SHA: 035d36b76715e69ddcc9066312be309c04676dca
    steps:
      - name: Read exact original source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 035d36b76715e69ddcc9066312be309c04676dca
          fetch-depth: 1
          persist-credentials: false
      - name: Execute all standalone native A2A scripts; report accurate counts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          shopt -s nullglob
          scripts=(tests/scripts/verify_native_a2a_*.py)
          count="${#scripts[@]}"
          printf '%s\n' "${scripts[@]}"
          echo "Discovered $count native A2A standalone script suites"
          passed=0; failed=0
          for script in "${scripts[@]}"; do
            echo "::group::$(basename "$script")"
            if timeout 150s python3 -u "$script"; then
              passed=$((passed+1))
            else
              failed=$((failed+1))
              echo "::error::$script failed"
            fi
            echo "::endgroup::"
          done
          echo "ORIGINAL $HEAD_SHA: $passed PASS / $failed FAIL / $count discovered"
          if [ "$count" -ne 19 ]; then
            echo "::error::Expected 19 ORIGINAL security suites; do not report GO for partial discovery"
            exit 1
          fi
          test "$failed" -eq 0
